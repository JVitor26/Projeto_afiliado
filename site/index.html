<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lúmina Noir | Ofertas premium selecionadas</title>
    <meta name="description" content="Curadoria premium de ofertas do Mercado Livre, Amazon, AliExpress e Shopee com descontos reais.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <!-- TOPBAR -->
    <header class="topbar">
      <a class="brand" href="#catalogo" aria-label="Lúmina Noir">
        <span class="brand-icon">LN</span>
        <span class="brand-text">
          <strong>Lúmina Noir</strong>
          <small>Curadoria premium</small>
        </span>
      </a>

      <label class="search-bar" aria-label="Buscar produtos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Buscar produto, categoria ou loja…" autocomplete="off">
      </label>

      <nav class="topbar-nav">
        <a class="nav-wpp" href="https://whatsapp.com/channel/0029Vb6G99PK0IBmcPVy8s2w" target="_blank" rel="noopener noreferrer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp
        </a>
        <button class="nav-fav" id="favoritesButton" type="button" aria-label="Favoritos">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span id="favoriteCount">0</span>
        </button>
      </nav>
    </header>

    <main>

      <!-- METRICS -->
      <div class="metrics-band" aria-label="Indicadores">
        <div><strong id="metricProducts">0</strong><span>produtos</span></div>
        <div><strong id="metricDiscount">0%</strong><span>maior desconto</span></div>
        <div><strong id="metricShipping">0</strong><span>frete grátis</span></div>
        <div><strong id="metricSources">0</strong><span>marketplaces</span></div>
      </div>

      <!-- OFERTAS DO DIA -->
      <section class="deals-section" id="dailyDealsSection" hidden aria-labelledby="dealsBadge">
        <div class="deals-header">
          <span class="deals-badge" id="dealsBadge">🔥 MELHORES OFERTAS</span>
          <span class="deals-sub">Maiores descontos agora · Atualizado automaticamente</span>
        </div>
        <div class="deals-grid" id="dealsGrid"></div>
      </section>

      <!-- CATÁLOGO -->
      <section class="catalog" id="catalogo" aria-labelledby="catalogHeading">

        <!-- FILTRO POR MARKETPLACE -->
        <div class="source-bar" id="sourceFilters" role="group" aria-label="Filtrar por marketplace"></div>

        <!-- CATEGORIAS -->
        <div class="category-bar" id="categoryRail" role="group" aria-label="Categorias"></div>

        <!-- TOOLBAR -->
        <div class="catalog-toolbar">
          <label class="toolbar-sort">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
            <select id="sortSelect">
              <option value="score">Melhor curadoria</option>
              <option value="discount">Maior desconto</option>
              <option value="priceAsc">Menor preço</option>
              <option value="priceDesc">Maior preço</option>
            </select>
          </label>

          <div class="price-row-filter">
            <input id="minPriceInput" type="number" min="0" inputmode="decimal" placeholder="R$ mín.">
            <span>—</span>
            <input id="maxPriceInput" type="number" min="0" inputmode="decimal" placeholder="R$ máx.">
          </div>

          <label class="shipping-check">
            <input id="freeShippingOnly" type="checkbox">
            <span>Frete grátis</span>
          </label>

          <div class="toolbar-results">
            <span id="resultCount">0 produtos</span>
            <button id="clearFilters" type="button" class="btn-clear">Limpar</button>
          </div>
        </div>

        <!-- GRID DE PRODUTOS -->
        <div id="productGrid" class="product-grid-wrap"></div>

        <div class="empty-state" id="emptyState" hidden>
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <h3>Nenhum produto encontrado</h3>
          <p>Ajuste os filtros ou execute uma nova mineração no bot.</p>
        </div>

      </section>
    </main>

    <!-- DRAWER BACKDROP -->
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

    <!-- PRODUCT DRAWER -->
    <aside class="product-drawer" id="productDrawer" aria-hidden="true" aria-label="Detalhes do produto">
      <button class="drawer-close" id="drawerClose" type="button" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div id="drawerContent"></div>
    </aside>

    <!-- PRODUCT CARD TEMPLATE -->
    <template id="productCardTemplate">
      <article class="product-card">
        <div class="card-img-wrap">
          <button class="card-media" type="button" aria-label="Ver produto"></button>
          <div class="card-badges">
            <span class="discount-pill"></span>
          </div>
          <button class="favorite-toggle" type="button" aria-label="Adicionar aos favoritos">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="source-pill"></span>
            <span class="category-chip"></span>
          </div>
          <h3 class="card-title"></h3>
          <div class="card-price">
            <strong class="price-now"></strong>
            <s class="price-was"></s>
          </div>
          <div class="card-actions">
            <button class="btn-details" type="button">Detalhes</button>
            <a class="btn-buy" target="_blank" rel="noopener noreferrer">Comprar</a>
          </div>
        </div>
      </article>
    </template>

    <script src="products.js"></script>
    <script src="app.js"></script>
  </body>
</html>
