name: Agendador Afiliado

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar sem enviar para o Telegram"
        required: false
        default: false
        type: boolean
      product_url:
        description: "🔗 Cole aqui o link do produto (Amazon, AliExpress, Shopee ou Mercado Livre) para postar agora"
        required: false
        type: string
        default: ""
  schedule:
    # GitHub usa UTC. Este agendamento roda a cada 8 minutos.
    - cron: "*/8 * * * *"

concurrency:
  group: afiliado-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  automacao:
    name: Minerar, publicar e atualizar site
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: data/affiliate.db
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      TELEGRAM_TECH_BOT_TOKEN: ${{ secrets.TELEGRAM_TECH_BOT_TOKEN }}
      TELEGRAM_TECH_CHAT_IDS: ${{ secrets.TELEGRAM_TECH_CHAT_IDS }}
      MERCADOLIVRE_CLIENT_ID: ${{ secrets.MERCADOLIVRE_CLIENT_ID }}
      MERCADOLIVRE_CLIENT_SECRET: ${{ secrets.MERCADOLIVRE_CLIENT_SECRET }}
      MERCADOLIVRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIVRE_ACCESS_TOKEN }}
      MERCADOLIVRE_REFRESH_TOKEN: ${{ secrets.MERCADOLIVRE_REFRESH_TOKEN }}
      SHOPEE_AUTHORIZATION_HEADER: ${{ secrets.SHOPEE_AUTHORIZATION_HEADER }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      AMAZON_AUTHORIZATION_HEADER: ${{ secrets.AMAZON_AUTHORIZATION_HEADER }}
      AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
      AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
      # A tag de associado nao e sigilosa (ela aparece em todo link publicado),
      # mas aceitamos como secret ou como variable para nao depender de onde foi
      # cadastrada. O passo abaixo so sobrescreve se a variable estiver preenchida.
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      SOCIAL_WEBHOOK_URLS: ${{ secrets.SOCIAL_WEBHOOK_URLS }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_CHAT_IDS: ${{ secrets.WHATSAPP_CHAT_IDS }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: bash
        run: |
          pip install -e . --quiet
          pip install Pillow --quiet

      - name: Aplicar variaveis opcionais
        shell: bash
        env:
          V_PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          V_KEYWORDS: ${{ vars.KEYWORDS }}
          V_DENY_KEYWORDS: ${{ vars.DENY_KEYWORDS }}
          V_ENABLED_SOURCES: ${{ vars.ENABLED_SOURCES }}
          V_MIN_PRICE: ${{ vars.MIN_PRICE }}
          V_MAX_PRICE: ${{ vars.MAX_PRICE }}
          V_MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT }}
          V_MIN_SCORE_TO_PUBLISH: ${{ vars.MIN_SCORE_TO_PUBLISH }}
          V_REQUIRE_PRODUCT_IMAGE: ${{ vars.REQUIRE_PRODUCT_IMAGE }}
          V_MIN_SOLD_QUANTITY: ${{ vars.MIN_SOLD_QUANTITY }}
          V_MIN_SELLER_TRANSACTIONS: ${{ vars.MIN_SELLER_TRANSACTIONS }}
          V_MINE_LIMIT_PER_KEYWORD: ${{ vars.MINE_LIMIT_PER_KEYWORD }}
          V_PUBLISH_LIMIT: ${{ vars.PUBLISH_LIMIT }}
          V_REPOST_AFTER_MINUTES: ${{ vars.REPOST_AFTER_MINUTES }}
          V_SITE_EXPORT_LIMIT: ${{ vars.SITE_EXPORT_LIMIT }}
          V_MERCADOLIVRE_SITE_ID: ${{ vars.MERCADOLIVRE_SITE_ID }}
          V_MERCADOLIVRE_REDIRECT_URI: ${{ vars.MERCADOLIVRE_REDIRECT_URI }}
          V_MERCADOLIVRE_AFFILIATE_ID: ${{ vars.MERCADOLIVRE_AFFILIATE_ID }}
          V_MERCADOLIVRE_AFFILIATE_TEMPLATE: ${{ vars.MERCADOLIVRE_AFFILIATE_TEMPLATE }}
          V_SHOPEE_PRODUCT_FEED_URL: ${{ vars.SHOPEE_PRODUCT_FEED_URL }}
          V_SHOPEE_FEED_PATH: ${{ vars.SHOPEE_FEED_PATH }}
          V_SHOPEE_AFFILIATE_ID: ${{ vars.SHOPEE_AFFILIATE_ID }}
          V_SHOPEE_AFFILIATE_TEMPLATE: ${{ vars.SHOPEE_AFFILIATE_TEMPLATE }}
          V_SHOPEE_SORT_TYPE: ${{ vars.SHOPEE_SORT_TYPE }}
          V_SHOPEE_START_PAGE: ${{ vars.SHOPEE_START_PAGE }}
          V_SHOPEE_API_URL: ${{ vars.SHOPEE_API_URL }}
          V_SHOPEE_LIST_TYPE: ${{ vars.SHOPEE_LIST_TYPE }}
          V_AMAZON_MODE: ${{ vars.AMAZON_MODE }}
          V_AMAZON_PRODUCT_FEED_URL: ${{ vars.AMAZON_PRODUCT_FEED_URL }}
          V_AMAZON_FEED_PATH: ${{ vars.AMAZON_FEED_PATH }}
          V_AMAZON_CREATORS_API_URL: ${{ vars.AMAZON_CREATORS_API_URL }}
          V_AMAZON_CREATORS_VERSION: ${{ vars.AMAZON_CREATORS_VERSION }}
          V_AMAZON_CREATORS_TOKEN_URL: ${{ vars.AMAZON_CREATORS_TOKEN_URL }}
          V_AMAZON_PARTNER_TAG: ${{ vars.AMAZON_PARTNER_TAG }}
          V_AMAZON_PARTNER_TYPE: ${{ vars.AMAZON_PARTNER_TYPE }}
          V_AMAZON_HOST: ${{ vars.AMAZON_HOST }}
          V_AMAZON_REGION: ${{ vars.AMAZON_REGION }}
          V_AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE }}
          V_AMAZON_SEARCH_INDEX: ${{ vars.AMAZON_SEARCH_INDEX }}
          V_AMAZON_AFFILIATE_TEMPLATE: ${{ vars.AMAZON_AFFILIATE_TEMPLATE }}
          V_AMAZON_BESTSELLERS_CATEGORIES: ${{ vars.AMAZON_BESTSELLERS_CATEGORIES }}
          V_AMAZON_BESTSELLERS_LIMIT: ${{ vars.AMAZON_BESTSELLERS_LIMIT }}
          V_AMAZON_BESTSELLERS_PAGES: ${{ vars.AMAZON_BESTSELLERS_PAGES }}
          V_AMAZON_BESTSELLERS_ATTEMPTS: ${{ vars.AMAZON_BESTSELLERS_ATTEMPTS }}
          V_AMAZON_BESTSELLERS_DELAY: ${{ vars.AMAZON_BESTSELLERS_DELAY }}
          V_ALIEXPRESS_MODE: ${{ vars.ALIEXPRESS_MODE }}
          V_ALIEXPRESS_PRODUCT_FEED_URL: ${{ vars.ALIEXPRESS_PRODUCT_FEED_URL }}
          V_ALIEXPRESS_FEED_PATH: ${{ vars.ALIEXPRESS_FEED_PATH }}
          V_ALIEXPRESS_API_URL: ${{ vars.ALIEXPRESS_API_URL }}
          V_ALIEXPRESS_TRACKING_ID: ${{ vars.ALIEXPRESS_TRACKING_ID }}
          V_ALIEXPRESS_AFFILIATE_TEMPLATE: ${{ vars.ALIEXPRESS_AFFILIATE_TEMPLATE }}
          V_ALIEXPRESS_SIGN_METHOD: ${{ vars.ALIEXPRESS_SIGN_METHOD }}
          V_ALIEXPRESS_TARGET_CURRENCY: ${{ vars.ALIEXPRESS_TARGET_CURRENCY }}
          V_ALIEXPRESS_TARGET_LANGUAGE: ${{ vars.ALIEXPRESS_TARGET_LANGUAGE }}
          V_ALIEXPRESS_SHIP_TO_COUNTRY: ${{ vars.ALIEXPRESS_SHIP_TO_COUNTRY }}
          V_ALIEXPRESS_SORT: ${{ vars.ALIEXPRESS_SORT }}
          V_ALIEXPRESS_START_PAGE: ${{ vars.ALIEXPRESS_START_PAGE }}
          V_ALIEXPRESS_FIELDS: ${{ vars.ALIEXPRESS_FIELDS }}
          V_TELEGRAM_PARSE_MODE: ${{ vars.TELEGRAM_PARSE_MODE }}
          V_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW: ${{ vars.TELEGRAM_DISABLE_WEB_PAGE_PREVIEW }}
          V_SOCIAL_WEBHOOK_URLS: ${{ vars.SOCIAL_WEBHOOK_URLS }}
          V_WHATSAPP_GRAPH_API_VERSION: ${{ vars.WHATSAPP_GRAPH_API_VERSION }}
          V_WHATSAPP_CHANNEL_URL: ${{ vars.WHATSAPP_CHANNEL_URL }}
        run: |
          set -euo pipefail

          add_env() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              {
                echo "$key<<EOF"
                echo "$value"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi
          }

          add_env PUBLIC_BASE_URL "$V_PUBLIC_BASE_URL"
          add_env KEYWORDS "$V_KEYWORDS"
          add_env DENY_KEYWORDS "$V_DENY_KEYWORDS"
          add_env ENABLED_SOURCES "$V_ENABLED_SOURCES"
          add_env MIN_PRICE "$V_MIN_PRICE"
          add_env MAX_PRICE "$V_MAX_PRICE"
          add_env MIN_DISCOUNT_PERCENT "$V_MIN_DISCOUNT_PERCENT"
          add_env MIN_SCORE_TO_PUBLISH "$V_MIN_SCORE_TO_PUBLISH"
          add_env REQUIRE_PRODUCT_IMAGE "$V_REQUIRE_PRODUCT_IMAGE"
          add_env MIN_SOLD_QUANTITY "$V_MIN_SOLD_QUANTITY"
          add_env MIN_SELLER_TRANSACTIONS "$V_MIN_SELLER_TRANSACTIONS"
          add_env MINE_LIMIT_PER_KEYWORD "$V_MINE_LIMIT_PER_KEYWORD"
          add_env PUBLISH_LIMIT "$V_PUBLISH_LIMIT"
          add_env REPOST_AFTER_MINUTES "${V_REPOST_AFTER_MINUTES:-240}"
          add_env SITE_EXPORT_LIMIT "$V_SITE_EXPORT_LIMIT"
          add_env MERCADOLIVRE_SITE_ID "$V_MERCADOLIVRE_SITE_ID"
          add_env MERCADOLIVRE_REDIRECT_URI "$V_MERCADOLIVRE_REDIRECT_URI"
          add_env MERCADOLIVRE_AFFILIATE_ID "$V_MERCADOLIVRE_AFFILIATE_ID"
          add_env MERCADOLIVRE_AFFILIATE_TEMPLATE "$V_MERCADOLIVRE_AFFILIATE_TEMPLATE"
          add_env SHOPEE_PRODUCT_FEED_URL "$V_SHOPEE_PRODUCT_FEED_URL"
          add_env SHOPEE_FEED_PATH "$V_SHOPEE_FEED_PATH"
          add_env SHOPEE_AFFILIATE_ID "$V_SHOPEE_AFFILIATE_ID"
          add_env SHOPEE_AFFILIATE_TEMPLATE "$V_SHOPEE_AFFILIATE_TEMPLATE"
          add_env SHOPEE_SORT_TYPE "$V_SHOPEE_SORT_TYPE"
          add_env SHOPEE_START_PAGE "$V_SHOPEE_START_PAGE"
          add_env SHOPEE_API_URL "$V_SHOPEE_API_URL"
          add_env SHOPEE_LIST_TYPE "$V_SHOPEE_LIST_TYPE"
          add_env AMAZON_MODE "$V_AMAZON_MODE"
          add_env AMAZON_PRODUCT_FEED_URL "$V_AMAZON_PRODUCT_FEED_URL"
          add_env AMAZON_FEED_PATH "$V_AMAZON_FEED_PATH"
          add_env AMAZON_CREATORS_API_URL "$V_AMAZON_CREATORS_API_URL"
          add_env AMAZON_CREATORS_VERSION "$V_AMAZON_CREATORS_VERSION"
          add_env AMAZON_CREATORS_TOKEN_URL "$V_AMAZON_CREATORS_TOKEN_URL"
          add_env AMAZON_PARTNER_TAG "$V_AMAZON_PARTNER_TAG"
          add_env AMAZON_PARTNER_TYPE "$V_AMAZON_PARTNER_TYPE"
          add_env AMAZON_HOST "$V_AMAZON_HOST"
          add_env AMAZON_REGION "$V_AMAZON_REGION"
          add_env AMAZON_MARKETPLACE "$V_AMAZON_MARKETPLACE"
          add_env AMAZON_SEARCH_INDEX "$V_AMAZON_SEARCH_INDEX"
          add_env AMAZON_AFFILIATE_TEMPLATE "$V_AMAZON_AFFILIATE_TEMPLATE"
          add_env AMAZON_BESTSELLERS_CATEGORIES "$V_AMAZON_BESTSELLERS_CATEGORIES"
          add_env AMAZON_BESTSELLERS_LIMIT "$V_AMAZON_BESTSELLERS_LIMIT"
          add_env AMAZON_BESTSELLERS_PAGES "$V_AMAZON_BESTSELLERS_PAGES"
          add_env AMAZON_BESTSELLERS_ATTEMPTS "$V_AMAZON_BESTSELLERS_ATTEMPTS"
          add_env AMAZON_BESTSELLERS_DELAY "$V_AMAZON_BESTSELLERS_DELAY"
          add_env ALIEXPRESS_MODE "$V_ALIEXPRESS_MODE"
          add_env ALIEXPRESS_PRODUCT_FEED_URL "$V_ALIEXPRESS_PRODUCT_FEED_URL"
          add_env ALIEXPRESS_FEED_PATH "$V_ALIEXPRESS_FEED_PATH"
          add_env ALIEXPRESS_API_URL "$V_ALIEXPRESS_API_URL"
          add_env ALIEXPRESS_TRACKING_ID "$V_ALIEXPRESS_TRACKING_ID"
          add_env ALIEXPRESS_AFFILIATE_TEMPLATE "$V_ALIEXPRESS_AFFILIATE_TEMPLATE"
          add_env ALIEXPRESS_SIGN_METHOD "$V_ALIEXPRESS_SIGN_METHOD"
          add_env ALIEXPRESS_TARGET_CURRENCY "$V_ALIEXPRESS_TARGET_CURRENCY"
          add_env ALIEXPRESS_TARGET_LANGUAGE "$V_ALIEXPRESS_TARGET_LANGUAGE"
          add_env ALIEXPRESS_SHIP_TO_COUNTRY "$V_ALIEXPRESS_SHIP_TO_COUNTRY"
          add_env ALIEXPRESS_SORT "$V_ALIEXPRESS_SORT"
          add_env ALIEXPRESS_START_PAGE "$V_ALIEXPRESS_START_PAGE"
          add_env ALIEXPRESS_FIELDS "$V_ALIEXPRESS_FIELDS"
          add_env TELEGRAM_PARSE_MODE "$V_TELEGRAM_PARSE_MODE"
          add_env TELEGRAM_DISABLE_WEB_PAGE_PREVIEW "$V_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW"
          if [ -z "${SOCIAL_WEBHOOK_URLS:-}" ]; then
            add_env SOCIAL_WEBHOOK_URLS "$V_SOCIAL_WEBHOOK_URLS"
          fi
          add_env WHATSAPP_GRAPH_API_VERSION "$V_WHATSAPP_GRAPH_API_VERSION"
          add_env WHATSAPP_CHANNEL_URL "$V_WHATSAPP_CHANNEL_URL"

      - name: Mostrar destinos configurados
        shell: bash
        run: |
          set -euo pipefail

          telegram="nao"
          telegram_tech="nao"
          whatsapp_numero="nao"
          webhook="nao"
          whatsapp_canal="nao"

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_IDS:-}" ]; then
            telegram="sim"
          fi
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_TECH_CHAT_IDS:-}" ]; then
            telegram_tech="sim"
          fi
          if [ -n "${WHATSAPP_ACCESS_TOKEN:-}" ] && [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] && [ -n "${WHATSAPP_CHAT_IDS:-}" ]; then
            whatsapp_numero="sim"
          fi
          if [ -n "${SOCIAL_WEBHOOK_URLS:-}" ]; then
            webhook="sim"
          fi
          if [ -n "${WHATSAPP_CHANNEL_URL:-}" ]; then
            whatsapp_canal="sim"
          fi

          echo "Telegram (geral) configurado: $telegram"
          echo "Telegram (tech) configurado: $telegram_tech"
          echo "WhatsApp por numero configurado: $whatsapp_numero"
          echo "Webhook configurado: $webhook"
          echo "Canal do WhatsApp informado: $whatsapp_canal"

      - name: Restaurar banco do bot
        uses: actions/cache/restore@v5
        with:
          path: |
            data/affiliate.db
            data/affiliate.db-shm
            data/affiliate.db-wal
          key: afiliado-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            afiliado-db-

      - name: Rodar testes
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests

      - name: Conferir destino de publicacao
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          has_telegram=false
          has_whatsapp=false
          has_webhook=false

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_IDS:-}" ]; then
            has_telegram=true
          fi
          if [ -n "${WHATSAPP_ACCESS_TOKEN:-}" ] && [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] && [ -n "${WHATSAPP_CHAT_IDS:-}" ]; then
            has_whatsapp=true
          fi
          if [ -n "${SOCIAL_WEBHOOK_URLS:-}" ]; then
            has_webhook=true
          fi

          if [ "$has_telegram" != "true" ] && [ "$has_whatsapp" != "true" ] && [ "$has_webhook" != "true" ]; then
            echo "::error::Configure Telegram, WhatsApp por numero ou SOCIAL_WEBHOOK_URLS em Settings > Secrets and variables > Actions. SOCIAL_WEBHOOK_URLS pode ficar em Repository secrets ou Repository variables."
            exit 1
          fi

      - name: Renovar token Mercado Livre
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MERCADOLIVRE_CLIENT_ID:-}" ] && [ -n "${MERCADOLIVRE_CLIENT_SECRET:-}" ] && [ -n "${MERCADOLIVRE_REFRESH_TOKEN:-}" ]; then
            python -m afiliado_bot mercadolivre-refresh-token --github-env
          fi

      # O refresh token do Mercado Livre e de uso unico: cada renovacao devolve
      # um novo e invalida o anterior. Como o passo acima so grava no GITHUB_ENV
      # (que vive um run), sem este passo a proxima execucao reapresentaria um
      # token ja consumido — e o ML passaria a responder 401 para sempre.
      - name: Persistir refresh token do Mercado Livre
        if: env.MERCADOLIVRE_REFRESH_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GH_SECRETS_TOKEN nao configurado. O refresh token renovado nao sera salvo, entao o Mercado Livre voltara a falhar com 401 na proxima execucao. Crie um token com permissao de escrita em secrets e cadastre como GH_SECRETS_TOKEN."
            exit 0
          fi
          gh secret set MERCADOLIVRE_REFRESH_TOKEN --body "$MERCADOLIVRE_REFRESH_TOKEN"
          gh secret set MERCADOLIVRE_ACCESS_TOKEN --body "$MERCADOLIVRE_ACCESS_TOKEN"
          echo "Tokens do Mercado Livre persistidos nos secrets."

      - name: Postar link manual (quando URL informada)
        if: github.event_name == 'workflow_dispatch' && inputs.product_url != ''
        shell: bash
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
        run: |
          set -euo pipefail
          echo "Processando link: ${PRODUCT_URL}"
          python -m afiliado_bot init-db
          if [ "$DRY_RUN" = "true" ]; then
            python -m afiliado_bot link-offer "${PRODUCT_URL}" --no-auto-publish
          else
            python -m afiliado_bot link-offer "${PRODUCT_URL}"
          fi
          python -m afiliado_bot export-site --limit "${SITE_EXPORT_LIMIT:-120}" --keep-existing-if-empty

      - name: Publicar oferta
        shell: bash
        run: |
          set -euo pipefail
          python -m afiliado_bot init-db
          python -m afiliado_bot seed-site-products --only-if-empty --limit "${SITE_EXPORT_LIMIT:-120}"
          if [ "$DRY_RUN" = "true" ]; then
            python -m afiliado_bot publish --limit "${PUBLISH_LIMIT:-4}" --dry-run
          else
            python -m afiliado_bot publish --limit "${PUBLISH_LIMIT:-4}"
          fi

      - name: Minerar e exportar loja
        shell: bash
        run: |
          set -euo pipefail
          # Rodizio: cada execucao minera UMA loja (ML, Amazon, Shopee, AliExpress).
          # Ciclo curto e cada marketplace recebe so o que precisa.
          python -m afiliado_bot mine --limit-per-keyword "${MINE_LIMIT_PER_KEYWORD:-20}" --allow-errors
          python -m afiliado_bot export-site --limit "${SITE_EXPORT_LIMIT:-120}" --keep-existing-if-empty
          python -m afiliado_bot generate-stats
          python -m afiliado_bot stats

      # Uma loja pode morrer em silencio (credencial expirada, API bloqueada):
      # `mine --allow-errors` engole o erro e o workflow segue verde. Este passo
      # avisa no Telegram. Sai 1 quando ha fonte parada, mas isso nao derruba a
      # execucao — o alerta e o objetivo, nao falhar o build.
      - name: Vigiar saude das lojas
        if: env.DRY_RUN != 'true'
        shell: bash
        run: python -m afiliado_bot check-sources --hours "${SOURCE_STALE_HOURS:-24}" || true

      - name: Salvar banco do bot
        if: env.DRY_RUN != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            data/affiliate.db
            data/affiliate.db-shm
            data/affiliate.db-wal
          key: afiliado-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configurar GitHub Pages
        if: env.DRY_RUN != 'true'
        uses: actions/configure-pages@v5

      - name: Enviar site estatico
        if: env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # O deploy do Pages fica em job separado de proposito. Declarar
  # `environment: github-pages` no job principal fazia a mineracao e a
  # publicacao no Telegram ficarem presas atras do environment: qualquer
  # instabilidade do Pages/Actions deixava o job inteiro em "waiting" e o canal
  # em silencio, mesmo sem relacao com o site.
  deploy:
    name: Publicar GitHub Pages
    needs: automacao
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
